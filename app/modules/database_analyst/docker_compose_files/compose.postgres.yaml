name: database-analyst-postgres

services:
  postgres:
    image: postgres:17
    container_name: database-analyst-postgres
    environment:
      POSTGRES_DB: analyst_db
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
