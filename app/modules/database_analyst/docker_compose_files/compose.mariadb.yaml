name: database-analyst-mariadb

services:
  mariadb:
    image: mariadb:11.4
    container_name: database-analyst-mariadb
    environment:
      MARIADB_DATABASE: analyst_db
      MARIADB_USER: analyst
      MARIADB_PASSWORD: analyst_password
      MARIADB_ROOT_PASSWORD: analyst_root_password
    ports:
      - "3308:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mariadb_data:
