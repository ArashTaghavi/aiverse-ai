name: database-analyst-mysql

services:
  mysql:
    image: mysql:8.4
    container_name: database-analyst-mysql
    environment:
      MYSQL_DATABASE: analyst_db
      MYSQL_USER: analyst
      MYSQL_PASSWORD: analyst_password
      MYSQL_ROOT_PASSWORD: analyst_root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
