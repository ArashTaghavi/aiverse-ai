services:
  sqlite:
    image: ghcr.io/coleifer/sqlite-web:latest
    container_name: ${CONTAINER_NAME:-sqlite-123}
    ports:
      - "8080:8080"
    volumes:
      - ${DATABASE_PATH:-../../../uploads/database.db}:/data/database.sqlite
    command: ["database.sqlite", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped
